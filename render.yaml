services:
  - type: web
    name: dietplan
    runtime: python
    buildCommand: pip install -r requirements.txt && npm install --prefix frontend && npm run build --prefix frontend && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn dietplan.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: NOURISH_EMAIL_HOST_USER
        sync: false
      - key: NOURISH_EMAIL_HOST_PASSWORD
        sync: false
